# SPDX-License-Identifier: MIT OR Apache-2.0
# .github/workflows/sim.yml
# Verilator simulation for spikenaut-core-sv unit testbenches.
# Addresses issue #9: runs on push/PR using free GitHub-hosted runners.
# See also: scripts/sim_core.tcl (Vivado equivalent), PR #11 (testbench $fatal hardening).

name: RTL Simulation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verilator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Run tb_LifNeuron
        run: |
          rm -rf obj_dir
          # Compile then execute as separate commands for clearer failure attribution
          # (addresses review feedback on && chaining). GitHub Actions uses set -e.
          # The -Wno-* flags match the original implementation notes in issue #9
          # and are required for clean compilation of the existing testbenches
          # (timescales, intentional width handling, module/filename conventions).
          verilator --binary --timing -Wno-WIDTHEXPAND -Wno-DECLFILENAME -Wno-TIMESCALEMOD \
            --top-module tb_LifNeuron \
            -Ispikenaut-core-sv/rtl \
            spikenaut-core-sv/rtl/LifNeuron.sv \
            spikenaut-core-sv/tb/tb_LifNeuron.sv
          ./obj_dir/Vtb_LifNeuron

      - name: Run tb_WeightRam
        run: |
          rm -rf obj_dir
          verilator --binary --timing -Wno-WIDTHEXPAND -Wno-DECLFILENAME -Wno-TIMESCALEMOD \
            --top-module tb_WeightRam \
            -Ispikenaut-core-sv/rtl \
            spikenaut-core-sv/rtl/WeightRam.sv \
            spikenaut-core-sv/tb/tb_WeightRam.sv
          ./obj_dir/Vtb_WeightRam

      - name: Run tb_WeightRam_init
        run: |
          rm -rf obj_dir
          # INIT_FILE paths are repo-root relative (merged_v2 weights)
          verilator --binary --timing -Wno-WIDTHEXPAND -Wno-DECLFILENAME -Wno-TIMESCALEMOD \
            --top-module tb_WeightRam_init \
            -Ispikenaut-core-sv/rtl \
            spikenaut-core-sv/rtl/WeightRam.sv \
            spikenaut-core-sv/tb/tb_WeightRam_init.sv
          ./obj_dir/Vtb_WeightRam_init

      - name: Run tb_NeuronParamRam
        run: |
          rm -rf obj_dir
          verilator --binary --timing -Wno-WIDTHEXPAND -Wno-DECLFILENAME -Wno-TIMESCALEMOD \
            --top-module tb_NeuronParamRam \
            -Ispikenaut-core-sv/rtl \
            spikenaut-core-sv/rtl/NeuronParamRam.sv \
            spikenaut-core-sv/tb/tb_NeuronParamRam.sv
          ./obj_dir/Vtb_NeuronParamRam

      - name: Run tb_NeuronParamRam_init
        run: |
          rm -rf obj_dir
          # INIT_FILE paths are repo-root relative (merged_v2 thresholds)
          verilator --binary --timing -Wno-WIDTHEXPAND -Wno-DECLFILENAME -Wno-TIMESCALEMOD \
            --top-module tb_NeuronParamRam_init \
            -Ispikenaut-core-sv/rtl \
            spikenaut-core-sv/rtl/NeuronParamRam.sv \
            spikenaut-core-sv/tb/tb_NeuronParamRam_init.sv
          ./obj_dir/Vtb_NeuronParamRam_init

      - name: Run tb_StdpController
        run: |
          rm -rf obj_dir
          verilator --binary --timing -Wno-WIDTHEXPAND -Wno-DECLFILENAME -Wno-TIMESCALEMOD \
            --top-module tb_StdpController \
            -Ispikenaut-core-sv/rtl \
            spikenaut-core-sv/rtl/StdpController.sv \
            spikenaut-core-sv/tb/tb_StdpController.sv
          ./obj_dir/Vtb_StdpController

      - name: Run tb_spikenaut_soc_basys3_top
        run: |
          rm -rf obj_dir
          # SoC-level TB (#57 / #60): the only sim covering the 1 ms step_en
          # divider and the UART-event -> tick-domain handoff. The core TBs
          # drive step_en themselves, so they cannot reach either.
          # Needs lib_bridge + lib_core + lib_soc in dependency order;
          # INIT_FILE paths are repo-root relative (merged_v2 images).
          verilator --binary --timing -Wno-WIDTHEXPAND -Wno-DECLFILENAME -Wno-TIMESCALEMOD \
            --top-module tb_spikenaut_soc_basys3_top \
            -Ispikenaut-core-sv/rtl -Ispikenaut-bridge-sv/rtl \
            spikenaut-bridge-sv/rtl/UartRx.sv \
            spikenaut-bridge-sv/rtl/UartTx.sv \
            spikenaut-bridge-sv/rtl/SiliconBridge.sv \
            spikenaut-core-sv/rtl/LifNeuron.sv \
            spikenaut-core-sv/rtl/WeightRam.sv \
            spikenaut-core-sv/rtl/NeuronParamRam.sv \
            spikenaut-core-sv/rtl/StdpController.sv \
            spikenaut-soc-sv/rtl/Basys3_Top.sv \
            spikenaut-soc-sv/tb/tb_Basys3_Top.sv
          ./obj_dir/Vtb_spikenaut_soc_basys3_top
