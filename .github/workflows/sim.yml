# .github/workflows/sim.yml
# Verilator simulation for core, bridge, and SoC unit testbenches.
# Addresses issue #9: runs on push/PR using free GitHub-hosted runners.
# The testbench list (tops, sources, include dirs, flags) is NOT written here:
# it comes from scripts/tb_manifest.json, the single source of truth shared
# with scripts/quality.sh and scripts/sim_core.tcl (via the generated
# scripts/tb_manifest.tcl). tests/test_tb_manifest.py fails on drift.
# See also: scripts/sim_core.tcl (Vivado equivalent), PR #11 (testbench $fatal hardening).

name: RTL Simulation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verilator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Validate testbench manifest
        run: |
          python3 scripts/tb_manifest.py validate
          # sim_core.tcl sources the generated Tcl list; fail if it is stale.
          python3 scripts/tb_manifest.py tcl --check

      - name: Check golden vectors are not stale
        run: |
          # GH#66 drift gate. Runs before the golden TBs so a stale committed
          # vector set is reported as such, rather than as an RTL mismatch.
          python3 scripts/gen_golden_lif_vectors.py --check

      - name: Check golden frame vectors are not stale
        run: |
          # GH#64 drift gate for the UART framing vectors. Same reasoning as
          # above: a stale frame vector set would make tb_SocFrameGolden check
          # the wire framing against a trace that no longer describes it.
          python3 scripts/gen_golden_frame_vectors.py --check

      - name: Check AER route image is not stale
        run: |
          python3 scripts/gen_aer_route_vectors.py --check

      - name: Run Verilator testbenches from tb_manifest.json
        run: |
          # Every testbench whose manifest "runners" include verilator. Each one
          # gets rm -rf obj_dir, then compile and execute as separate commands
          # for clear failure attribution, in its own ::group:: with an
          # ::error:: annotation naming the failing TB. All TBs run even if one
          # fails; the step exits non-zero if any failed. CWD is the repo root
          # ($readmemh / INIT_FILE / golden .mem paths are repo-root relative).
          # The -Wno-* flags (manifest "verilator_flags") match issue #9 and are
          # required for clean compilation of the existing testbenches.
          python3 scripts/tb_manifest.py run --all --github
