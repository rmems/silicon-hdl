name: Hardware project board

on:
  issues:
    types: [opened, reopened, transferred, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-project:
    runs-on: ubuntu-latest
    steps:
      - name: Sync issue with org Hardware project
        env:
          # Org PAT with project scope (preferred). Fall back names used in this org.
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.LIMEN_NEURAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          PROJECT_ID: PVT_kwDOEEyGS84BfB8y
          STATUS_FIELD_ID: PVTSSF_lADOEEyGS84BfB8yzhZX2Lc
          OPT_READY: "856cdede"
          OPT_DONE: "98236657"
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          NUM="${{ github.event.issue.number }}"
          STATE="${{ github.event.issue.state }}"

          ISSUE_NODE=$(gh api graphql -f query='
            query($owner:String!,$name:String!,$n:Int!){
              repository(owner:$owner,name:$name){ issue(number:$n){ id state } }
            }
          ' -f owner="$OWNER" -f name="$REPO" -F n="$NUM" --jq .data.repository.issue.id)
          echo "issue_node=$ISSUE_NODE state=$STATE"

          ITEM=$(gh api graphql -f query='
            mutation($projectId:ID!,$contentId:ID!){
              addProjectV2ItemById(input:{projectId:$projectId, contentId:$contentId}) {
                item { id }
              }
            }
          ' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_NODE" --jq .data.addProjectV2ItemById.item.id)
          echo "item=$ITEM"

          if [ "$STATE" = "open" ]; then
            gh api graphql -f query='
              mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){
                updateProjectV2ItemFieldValue(input:{
                  projectId:$projectId
                  itemId:$itemId
                  fieldId:$fieldId
                  value:{ singleSelectOptionId:$optionId }
                }) { projectV2Item { id } }
              }
            ' -f projectId="$PROJECT_ID" -f itemId="$ITEM" -f fieldId="$STATUS_FIELD_ID" -f optionId="$OPT_READY" >/dev/null
            echo "status=Ready"
          else
            gh api graphql -f query='
              mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){
                updateProjectV2ItemFieldValue(input:{
                  projectId:$projectId
                  itemId:$itemId
                  fieldId:$fieldId
                  value:{ singleSelectOptionId:$optionId }
                }) { projectV2Item { id } }
              }
            ' -f projectId="$PROJECT_ID" -f itemId="$ITEM" -f fieldId="$STATUS_FIELD_ID" -f optionId="$OPT_DONE" >/dev/null
            gh api graphql -f query='
              mutation($projectId:ID!,$itemId:ID!){
                archiveProjectV2Item(input:{projectId:$projectId, itemId:$itemId}) {
                  item { id isArchived }
                }
              }
            ' -f projectId="$PROJECT_ID" -f itemId="$ITEM" >/dev/null
            echo "status=Done archived=true"
          fi