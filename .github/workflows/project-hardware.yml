name: Hardware project board

on:
  issues:
    types: [opened, reopened, transferred, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to sync (default: all open issues)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  sync-project:
    runs-on: ubuntu-latest
    steps:
      # Two independent reasons this job could never succeed as written:
      #
      #   1. Projects v2 writes need a PAT/App with `project` scope. The default
      #      GITHUB_TOKEN does not have it, so falling back to it did not
      #      degrade gracefully -- it guaranteed "Resource not accessible by
      #      integration" and a red run on every issue event.
      #   2. The board it targeted (Limen-Neural org project #8 "Hardware") is
      #      CLOSED, left behind by the transfer to rmems (#75).
      #
      # So the target is now fully unconfigured by default rather than
      # defaulting to the dead board: a token alone is not enough to start
      # writing somewhere useless. Every id must be supplied explicitly.
      - name: Check project sync configuration
        id: gate
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_ID: ${{ vars.HARDWARE_PROJECT_ID }}
          STATUS_FIELD_ID: ${{ vars.HARDWARE_STATUS_FIELD_ID }}
          OPT_READY: ${{ vars.HARDWARE_OPT_READY }}
          OPT_DONE: ${{ vars.HARDWARE_OPT_DONE }}
        run: |
          missing=""
          if [ -z "${PROJECT_TOKEN:-}" ]; then missing="$missing PROJECTS_TOKEN(secret)"; fi
          if [ -z "${PROJECT_ID:-}" ]; then missing="$missing HARDWARE_PROJECT_ID"; fi
          if [ -z "${STATUS_FIELD_ID:-}" ]; then missing="$missing HARDWARE_STATUS_FIELD_ID"; fi
          if [ -z "${OPT_READY:-}" ]; then missing="$missing HARDWARE_OPT_READY"; fi
          if [ -z "${OPT_DONE:-}" ]; then missing="$missing HARDWARE_OPT_DONE"; fi

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Project sync skipped::Not configured; missing:$missing. The status field and option ids are per-board and must be re-derived for whichever board you target. See #87."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "project sync configured for $PROJECT_ID"
          fi

      - name: Sync issue(s) with the hardware project board
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_ID: ${{ vars.HARDWARE_PROJECT_ID }}
          STATUS_FIELD_ID: ${{ vars.HARDWARE_STATUS_FIELD_ID }}
          OPT_READY: ${{ vars.HARDWARE_OPT_READY }}
          OPT_DONE: ${{ vars.HARDWARE_OPT_DONE }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUM_EVENT: ${{ github.event.issue.number }}
          ISSUE_STATE_EVENT: ${{ github.event.issue.state }}
          DISPATCH_NUM: ${{ inputs.issue_number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          sync_one() {
            local NUM="$1"
            local STATE="$2"
            echo "---- sync #$NUM state=$STATE ----"

            ISSUE_NODE=$(gh api graphql -f query='
              query($owner:String!,$name:String!,$n:Int!){
                repository(owner:$owner,name:$name){ issue(number:$n){ id state } }
              }
            ' -f owner="$OWNER" -f name="$REPO" -F n="$NUM" --jq .data.repository.issue.id)

            if [ -z "$ISSUE_NODE" ] || [ "$ISSUE_NODE" = "null" ]; then
              echo "Could not resolve issue node for #$NUM" >&2
              return 1
            fi

            ITEM=$(gh api graphql -f query='
              mutation($projectId:ID!,$contentId:ID!){
                addProjectV2ItemById(input:{projectId:$projectId, contentId:$contentId}) {
                  item { id }
                }
              }
            ' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_NODE" --jq .data.addProjectV2ItemById.item.id)

            if [ -z "$ITEM" ] || [ "$ITEM" = "null" ]; then
              echo "addProjectV2ItemById failed for #$NUM" >&2
              return 1
            fi
            echo "item=$ITEM"

            if [ "$STATE" = "open" ]; then
              gh api graphql -f query='
                mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){
                  updateProjectV2ItemFieldValue(input:{
                    projectId:$projectId
                    itemId:$itemId
                    fieldId:$fieldId
                    value:{ singleSelectOptionId:$optionId }
                  }) { projectV2Item { id } }
                }
              ' -f projectId="$PROJECT_ID" -f itemId="$ITEM" -f fieldId="$STATUS_FIELD_ID" -f optionId="$OPT_READY" >/dev/null
              echo "status=Ready"
            else
              gh api graphql -f query='
                mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){
                  updateProjectV2ItemFieldValue(input:{
                    projectId:$projectId
                    itemId:$itemId
                    fieldId:$fieldId
                    value:{ singleSelectOptionId:$optionId }
                  }) { projectV2Item { id } }
                }
              ' -f projectId="$PROJECT_ID" -f itemId="$ITEM" -f fieldId="$STATUS_FIELD_ID" -f optionId="$OPT_DONE" >/dev/null
              gh api graphql -f query='
                mutation($projectId:ID!,$itemId:ID!){
                  archiveProjectV2Item(input:{projectId:$projectId, itemId:$itemId}) {
                    item { id isArchived }
                  }
                }
              ' -f projectId="$PROJECT_ID" -f itemId="$ITEM" >/dev/null
              echo "status=Done archived=true"
            fi
          }

          if [ "$EVENT_NAME" = "issues" ]; then
            sync_one "$ISSUE_NUM_EVENT" "$ISSUE_STATE_EVENT"
          elif [ -n "${DISPATCH_NUM:-}" ]; then
            STATE=$(gh api "repos/$OWNER/$REPO/issues/$DISPATCH_NUM" --jq .state)
            sync_one "$DISPATCH_NUM" "$STATE"
          else
            # Issues only (REST /issues includes PRs)
            mapfile -t NUMS < <(gh api "repos/$OWNER/$REPO/issues?state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | .number')
            echo "syncing ${#NUMS[@]} open issues (PRs excluded)"
            for n in "${NUMS[@]}"; do
              sync_one "$n" "open"
            done
          fi